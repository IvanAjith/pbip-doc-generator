name: tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install python-docx pypdf
      - name: Syntax check
        run: python -m compileall -q .
      - name: Tests
        run: |
          python tests/test_formula_draft.py
          python tests/test_ai_providers.py
          python tests/test_glossary_csv_ai.py
          python tests/test_web_glossary.py
          python tests/test_word_roundtrip.py
          python tests/test_end_to_end.py
